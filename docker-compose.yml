services:
  raceday-mvc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raceday-mvc
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiSettings__BaseUrl: ${RACEDAY_API_URL:-http://host.docker.internal:5080/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
